<!-- public/admin.html -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel Admin - Control Protegido</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: #0b1320; color: white; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    
    /* Modal de Bloqueo */
    .lock-overlay {
      position: fixed; inset: 0; background: rgba(8, 12, 16, 0.98); backdrop-filter: blur(10px);
      display: flex; justify-content: center; align-items: center; z-index: 500;
    }
    .lock-card {
      background: #16222f; width: 100%; max-width: 380px; padding: 30px; border-radius: 16px;
      border: 1px solid #334155; text-align: center; box-shadow: 0 16px 36px rgba(0,0,0,0.7);
    }

    .admin-card { background: #16222f; width: 100%; max-width: 700px; border-radius: 16px; padding: 25px; border: 1px solid #334155; box-shadow: 0 8px 24px rgba(0,0,0,0.5); display: none; }
    h2 { color: #ffd166; margin-bottom: 20px; text-align: center; }
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 10px; background: #080c10; border: 1px solid #334155; color: #cbd5e1; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .tab-btn.active { background: #0077b6; color: white; border-color: #0077b6; }
    .form-group { margin-bottom: 14px; text-align: left; }
    label { display: block; font-size: 0.85rem; color: #cbd5e1; margin-bottom: 6px; }
    input { width: 100%; padding: 12px; background: #080c10; border: 1px solid #334155; border-radius: 8px; color: white; font-size: 1rem; outline: none; }
    input:focus { border-color: #2a9d8f; }
    .btn-submit { padding: 12px; border: none; border-radius: 8px; color: white; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn-add { background: #2a9d8f; flex: 1; }
    .btn-add:hover { background: #21867a; }
    .btn-deduct { background: #e63946; flex: 1; }
    .btn-deduct:hover { background: #d90429; }
    .btn-pass { width: 100%; background: #0077b6; }
    .btn-pass:hover { background: #0096c7; }
    .user-table { width: 100%; margin-top: 25px; border-collapse: collapse; font-size: 0.9rem; }
    .user-table th, .user-table td { padding: 10px; border-bottom: 1px solid #1e293b; text-align: left; }
    .user-table th { color: #ffd166; font-size: 0.8rem; text-transform: uppercase; }
    .chips-badge { background: #0077b6; padding: 4px 8px; border-radius: 12px; font-weight: bold; }
    .msg { margin-top: 12px; padding: 10px; border-radius: 8px; text-align: center; font-weight: bold; display: none; }
    .msg.ok { background: #2ec4b6; color: #081c15; }
    .msg.err { background: #e63946; color: white; }
    .btn-logout { background: #475569; color: white; border: none; padding: 6px 12px; border-radius: 8px; font-size: 0.8rem; font-weight: bold; cursor: pointer; float: right; }
    .btn-logout:hover { background: #ef4444; }
  </style>
</head>
<body>

  <!-- Pantalla de Login Administrador -->
  <div class="lock-overlay" id="lockScreen">
    <div class="lock-card">
      <div style="font-size: 2.5rem; margin-bottom: 10px;">🔒</div>
      <h3 style="color:#ffd166; margin-bottom: 6px;">Panel de Administrador</h3>
      <p style="color:#94a3b8; font-size:0.85rem; margin-bottom: 18px;">Ingresá la contraseña maestra para continuar</p>
      
      <form onsubmit="handleAdminLogin(event)">
        <div class="form-group">
          <input type="password" id="inputAdminPin" placeholder="••••••••••••" required />
        </div>
        <button type="submit" class="btn-submit" style="width:100%; background:#2a9d8f; margin-top: 8px;">Desbloquear Panel</button>
      </form>
      <div id="lockErr" style="color:#ef4444; font-size:0.85rem; margin-top:10px; display:none;"></div>
    </div>
  </div>

  <!-- Panel Principal -->
  <div class="admin-card" id="adminPanel">
    <div>
      <button class="btn-logout" onclick="adminLogout()">Cerrar Sesión</button>
      <h2>🪙 Panel de Administración</h2>
    </div>

    <div class="tabs">
      <button class="tab-btn active" id="tabChips" onclick="switchAdminTab('chips')">Gestión de Fichas</button>
      <button class="tab-btn" id="tabPass" onclick="switchAdminTab('pass')">Cambiar Contraseña</button>
      <button class="btn-action" style="background:#ef4444; color:white;" onclick="deleteUserPrompt('${u.username}')">🗑️ Eliminar</button>
    </div>

    <!-- Form Gestión Fichas -->
    <div id="formChips">
      <div class="form-group">
        <label>Nombre de Usuario del Jugador:</label>
        <input type="text" id="targetUser" placeholder="Ej: jja1" required />
      </div>

      <div class="form-group">
        <label>Cantidad de Fichas (1 ARS = 1 Ficha):</label>
        <input type="number" id="targetAmount" placeholder="Ej: 5000" min="1" step="1" required />
      </div>

      <div style="display:flex; gap:10px;">
        <button type="button" class="btn-submit btn-add" onclick="handleChipsAction('add')">+ Acreditar Fichas</button>
        <button type="button" class="btn-submit btn-deduct" onclick="handleChipsAction('remove')">- Descontar Fichas</button>
      </div>
    </div>

    <!-- Form Cambiar Contraseña -->
    <form id="formPass" onsubmit="handleResetPass(event)" style="display:none;">
      <div class="form-group">
        <label>Nombre de Usuario del Jugador:</label>
        <input type="text" id="passUser" placeholder="Ej: jja1" required />
      </div>

      <div class="form-group">
        <label>Nueva Contraseña:</label>
        <input type="text" id="newPassValue" placeholder="Escribí la nueva contraseña" required />
      </div>

      <button type="submit" class="btn-submit btn-pass">Actualizar Contraseña</button>
    </form>

    <div id="statusMsg" class="msg"></div>

    <h3 style="color:#cbd5e1; margin-top: 30px; border-bottom: 1px solid #334155; padding-bottom: 8px;">Jugadores Registrados (Hacé clic en uno para seleccionarlo)</h3>
    <table class="user-table">
      <thead>
        <tr>
          <th>Usuario</th>
          <th>Nombre</th>
          <th>Saldo Fichas</th>
        </tr>
      </thead>
      <tbody id="userRows"></tbody>
    </table>
  </div>

  <script>
    let adminToken = localStorage.getItem('truco_admin_key') || '';

    function getHeaders() {
      return {
        'Content-Type': 'application/json',
        'x-admin-pin': adminToken
      };
    }

    async function handleAdminLogin(e) {
      e.preventDefault();
      const pin = document.getElementById('inputAdminPin').value;
      const err = document.getElementById('lockErr');

      try {
        const res = await fetch('/api/admin/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin })
        });
        const data = await res.json();

        if (res.ok) {
          adminToken = pin;
          localStorage.setItem('truco_admin_key', adminToken);
          unlockInterface();
        } else {
          err.innerText = data.message || 'Contraseña incorrecta.';
          err.style.display = 'block';
        }
      } catch {
        err.innerText = 'Error de conexión.';
        err.style.display = 'block';
      }
    }

    function unlockInterface() {
      document.getElementById('lockScreen').style.display = 'none';
      document.getElementById('adminPanel').style.display = 'block';
      loadUsers();
    }

    function adminLogout() {
      localStorage.removeItem('truco_admin_key');
      window.location.reload();
    }

    function switchAdminTab(tab) {
      document.getElementById('statusMsg').style.display = 'none';
      if (tab === 'chips') {
        document.getElementById('tabChips').classList.add('active');
        document.getElementById('tabPass').classList.remove('active');
        document.getElementById('formChips').style.display = 'block';
        document.getElementById('formPass').style.display = 'none';
      } else {
        document.getElementById('tabPass').classList.add('active');
        document.getElementById('tabChips').classList.remove('active');
        document.getElementById('formPass').style.display = 'block';
        document.getElementById('formChips').style.display = 'none';
      }
    }

    async function loadUsers() {
      const res = await fetch('/api/admin/users-list', { headers: getHeaders() });
      if (res.status === 401) { adminLogout(); return; }

      const data = await res.json();
      const tbody = document.getElementById('userRows');
      tbody.innerHTML = '';
      data.forEach(u => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>@${u.username}</strong></td>
          <td>${u.fullName}</td>
          <td><span class="chips-badge">$${new Intl.NumberFormat('es-AR').format(u.chips)}</span></td>
        `;
        tr.onclick = () => { 
          document.getElementById('targetUser').value = u.username; 
          document.getElementById('passUser').value = u.username; 
        };
        tr.style.cursor = 'pointer';
        tbody.appendChild(tr);
      });
    }
    async function deleteUserPrompt(username) {
  const confirmar = confirm(`⚠️ ¿Estás seguro de que deseás eliminar permanentemente al usuario @${username}?\n\nEsta acción borrará su cuenta y saldo de Supabase.`);
  if (!confirmar) return;

  const adminPin = localStorage.getItem('admin_pin') || sessionStorage.getItem('admin_pin');
  const res = await fetch('/api/admin/delete-user', {
    method: 'POST',
    headers: { 
      'Content-Type': 'application/json',
      'x-admin-pin': adminPin
    },
    body: JSON.stringify({ username })
  });

  const data = await res.json();
  if (res.ok) {
    alert(data.message);
    loadUsers(); // o la función que uses para refrescar la lista
  } else {
    alert(data.message);
  }
}

    async function handleChipsAction(actionType) {
      const username = document.getElementById('targetUser').value.trim();
      const amount = document.getElementById('targetAmount').value;
      const msg = document.getElementById('statusMsg');

      if (!username || !amount || Number(amount) <= 0) {
        msg.className = 'msg err';
        msg.innerText = 'Completá el usuario y un monto válido mayor a 0.';
        msg.style.display = 'block';
        return;
      }

      const endpoint = actionType === 'add' ? '/api/admin/add-chips' : '/api/admin/remove-chips';

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: getHeaders(),
          body: JSON.stringify({ username, amount })
        });
        const data = await res.json();

        msg.style.display = 'block';
        if (res.ok) {
          msg.className = 'msg ok';
          msg.innerText = data.message;
          document.getElementById('targetAmount').value = '';
          loadUsers();
        } else {
          msg.className = 'msg err';
          msg.innerText = data.message;
        }
      } catch {
        msg.className = 'msg err';
        msg.innerText = 'Error de conexión.';
        msg.style.display = 'block';
      }
    }

    async function handleResetPass(e) {
      e.preventDefault();
      const username = document.getElementById('passUser').value.trim();
      const newPassword = document.getElementById('newPassValue').value.trim();
      const msg = document.getElementById('statusMsg');

      try {
        const res = await fetch('/api/admin/reset-password', {
          method: 'POST',
          headers: getHeaders(),
          body: JSON.stringify({ username, newPassword })
        });
        const data = await res.json();

        msg.style.display = 'block';
        if (res.ok) {
          msg.className = 'msg ok';
          msg.innerText = data.message;
          document.getElementById('newPassValue').value = '';
        } else {
          msg.className = 'msg err';
          msg.innerText = data.message;
        }
      } catch {
        msg.className = 'msg err';
        msg.innerText = 'Error de conexión.';
        msg.style.display = 'block';
      }
    }

    // Comprobar si ya había una clave guardada
    window.addEventListener('DOMContentLoaded', async () => {
      if (adminToken) {
        const res = await fetch('/api/admin/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin: adminToken })
        });
        if (res.ok) {
          unlockInterface();
        } else {
          adminLogout();
        }
      }
    });
  </script>
</body>
</html>
