<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Restablecer contraseña - Truco Online</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(145deg,#07111a,#0b1f2a);font-family:Arial,Helvetica,sans-serif;color:#e2e8f0}
    .card{width:min(430px,100%);background:#0f172a;border:1px solid #253247;border-radius:18px;padding:28px;box-shadow:0 18px 60px rgba(0,0,0,.35)}
    .logo{display:block;width:70px;height:70px;object-fit:contain;margin:0 auto 12px}
    h1{font-size:1.5rem;text-align:center;margin:0 0 8px;color:#fff}
    .subtitle{text-align:center;color:#94a3b8;font-size:.9rem;line-height:1.5;margin-bottom:22px}
    label{display:block;font-size:.88rem;font-weight:700;margin:14px 0 7px;color:#cbd5e1}
    input{width:100%;padding:12px 13px;border-radius:9px;border:1px solid #334155;background:#08111b;color:#fff;outline:none;font-size:1rem}
    input:focus{border-color:#0077b6;box-shadow:0 0 0 2px rgba(0,119,182,.15)}
    button{width:100%;padding:12px;border:0;border-radius:9px;background:#0077b6;color:#fff;font-weight:800;font-size:1rem;cursor:pointer;margin-top:18px}
    button:disabled{opacity:.55;cursor:not-allowed}
    .status{display:none;padding:11px 12px;border-radius:9px;margin-top:15px;text-align:center;font-size:.88rem;line-height:1.4}
    .status.ok{display:block;background:#174f45;color:#b8fff3}
    .status.err{display:block;background:#4a1f25;color:#fecaca}
    .timer{text-align:center;color:#fbbf24;font-weight:700;font-size:.9rem;margin-top:12px}
    .back{display:block;text-align:center;color:#94a3b8;text-decoration:none;font-size:.88rem;margin-top:17px}
    .back:hover{color:#fff}
    #form{display:none}
  </style>
</head>
<body>
  <main class="card">
    <img src="/logo.png" class="logo" alt="Truco Online" />
    <h1>Restablecer contraseña</h1>
    <div class="subtitle">Este enlace es de un solo uso y vence 15 minutos después de haber sido generado.</div>

    <div id="loading" class="status ok" style="display:block;">Verificando enlace...</div>

    <form id="form">
      <label for="newPassword">Nueva contraseña</label>
      <input id="newPassword" type="password" minlength="6" autocomplete="new-password" required />
      <label for="confirmPassword">Confirmar contraseña</label>
      <input id="confirmPassword" type="password" minlength="6" autocomplete="new-password" required />
      <div id="timer" class="timer"></div>
      <button id="submitBtn" type="submit">Cambiar contraseña</button>
    </form>

    <div id="status" class="status"></div>
    <a class="back" href="/">Volver al inicio</a>
  </main>

  <script>
    const token = new URLSearchParams(window.location.search).get('token') || '';
    const loading = document.getElementById('loading');
    const form = document.getElementById('form');
    const status = document.getElementById('status');
    const timer = document.getElementById('timer');
    const submitBtn = document.getElementById('submitBtn');
    let expiresAtMs = 0;
    let countdownTimer = null;

    function showStatus(message, type) {
      status.className = 'status ' + type;
      status.textContent = message;
    }

    function renderCountdown() {
      const remaining = Math.max(0, expiresAtMs - Date.now());
      const totalSeconds = Math.floor(remaining / 1000);
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = String(totalSeconds % 60).padStart(2, '0');
      timer.textContent = remaining > 0 ? `Tiempo restante: ${minutes}:${seconds}` : 'El enlace venció.';
      if (remaining <= 0) {
        clearInterval(countdownTimer);
        submitBtn.disabled = true;
        showStatus('El enlace de recuperación venció. Solicitá uno nuevo por WhatsApp.', 'err');
      }
    }

    async function validateToken() {
      if (!/^[a-f0-9]{64}$/i.test(token)) {
        loading.style.display = 'none';
        showStatus('El enlace de recuperación no es válido.', 'err');
        return;
      }
      try {
        const res = await fetch('/api/auth/password-reset/validate?token=' + encodeURIComponent(token), { cache: 'no-store' });
        const data = await res.json();
        loading.style.display = 'none';
        if (!res.ok || !data.success) {
          showStatus(data.message || 'El enlace de recuperación no es válido o ya venció.', 'err');
          return;
        }
        expiresAtMs = new Date(data.expiresAt).getTime();
        form.style.display = 'block';
        renderCountdown();
        countdownTimer = setInterval(renderCountdown, 1000);
      } catch {
        loading.style.display = 'none';
        showStatus('No se pudo verificar el enlace. Revisá tu conexión e intentá nuevamente.', 'err');
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      if (newPassword.length < 6) {
        showStatus('La contraseña debe tener al menos 6 caracteres.', 'err');
        return;
      }
      if (newPassword !== confirmPassword) {
        showStatus('Las dos contraseñas no coinciden.', 'err');
        return;
      }
      if (expiresAtMs <= Date.now()) {
        showStatus('El enlace venció. Solicitá uno nuevo por WhatsApp.', 'err');
        return;
      }

      submitBtn.disabled = true;
      try {
        const res = await fetch('/api/auth/password-reset/complete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword, confirmPassword })
        });
        const data = await res.json();
        if (!res.ok || !data.success) {
          submitBtn.disabled = false;
          showStatus(data.message || 'No se pudo actualizar la contraseña.', 'err');
          return;
        }
        clearInterval(countdownTimer);
        form.style.display = 'none';
        timer.textContent = '';
        showStatus('Contraseña actualizada correctamente. Ya podés ingresar con tu nueva contraseña.', 'ok');
        setTimeout(() => { window.location.href = '/'; }, 2200);
      } catch {
        submitBtn.disabled = false;
        showStatus('Error de conexión. Intentá nuevamente.', 'err');
      }
    });

    validateToken();
  </script>
</body>
</html>
